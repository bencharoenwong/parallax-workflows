name: evals

permissions:
  contents: read

# Lightweight structural CI: runs the pure-function grader suite, the contract /
# fixture-provenance / precision gates, and the repo's doc-lint scripts on every
# PR and on pushes to main. No live Parallax / MCP calls, no secrets — these are
# the same offline checks contributors run locally.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # pyyaml is required by test_marketing_schema.py, which lives under
      # skills/_parallax/scripts/ and is therefore collected by the gates step
      # below. That test predates the step and had never run in CI, so its
      # import error surfaced only once the step started collecting the whole
      # directory. Installing the dependency runs the test rather than hiding
      # it behind an --ignore.
      # Every dependency any collected root needs. The six test roots added on
      # 2026-08-18 were wired in without their dependencies, so `House-view core
      # gates` failed collection on rfc8785 and, because a failed step ends the
      # job, the five steps after it never ran at all. CI reported one red step
      # while four were actually broken and the rest were untested.
      #
      # Keep this in sync when adding a step below. A missing dependency here
      # does not look like a missing dependency; it looks like a passing job
      # that silently stopped early.
      - name: Install test deps
        id: deps
        run: |
          python -m pip install --upgrade pip
          # pyyaml: test_marketing_schema.py under skills/_parallax/scripts/.
          # jsonschema: loader.py treats it as optional and SKIPS config schema
          # validation when absent, so without it three loader tests that assert
          # a malformed config is rejected fail — and the runtime silently stops
          # validating client configs at all.
          # pillow: validator.py treats it as optional and returns a pass with
          # unknown dimensions when absent, so the logo dimension gate stops
          # running and its three tests skip. It already resolved here as a
          # transitive requirement of python-pptx below; naming it directly
          # keeps that coverage from depending on a fixture-building package's
          # dependency list, which can drop it without touching this file.
          python -m pip install pytest pyyaml jsonschema pillow
          # pynacl + rfc8785: manifest_verify.py raises SystemExit on import
          # without them, which aborts collection for three house-view roots.
          python -m pip install -r skills/_parallax/house-view/requirements.txt
          # python-pptx + python-docx: build the .pptx/.docx fixtures the OOXML
          # extractor tests feed. Without them 18 tests error at fixture setup.
          python -m pip install -r skills/_parallax/white-label/requirements-test.txt
      - name: Grader unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest evals/graders/ -q
      - name: Contract, provenance and precision gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/_parallax/scripts/ -q
      # test_render_gate.py sits beside render_gate.py in skills/_parallax/, one
      # level above the scripts/ root collected by the step above. It is named
      # explicitly rather than by widening that root, which would also pull in
      # the white-label conftest subtree. This suite asserts the SKILL.md label /
      # anchor / gate-command contract across every gated skill, so a PR that
      # renames a rendered section fails here, not only in a local gate run.
      - name: Render-gate anchor and SKILL.md wiring gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/_parallax/test_render_gate.py -q
      # A separate process per top-level test root, not a second path appended
      # to the line above: three skills ship a `tests/conftest.py` and pytest
      # names every one `tests.conftest`, so collecting two roots in one process
      # can abort with "Plugin already registered". See run-gate-tests.sh, which
      # holds the same invariant for the local gate.
      #
      # This root carries the consumer side of the shared contract:
      # test_mcp_contracts.py reads the `result` envelope, the 0-10 vs 0-100
      # score scales and the money identities, and test_contribution_edges.py
      # covers the contribution conversion. The provenance gate above proves a
      # fixture matches its generator; only these prove the shape is the one
      # skills actually read.
      - name: CIO letter-prep contract and contribution gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-cio-letter-prep/ -q
      # Its own process for the same conftest reason. This root was MISSING
      # until 2026-08-18: the exposure-cap fix and its regression suite landed
      # with GitHub CI never executing a single one of those tests, so the whole
      # safety argument for that change rested on a suite only the local
      # pre-push gate ran. run-gate-tests.sh auto-discovers roots and did cover
      # it; this file does not auto-discover, so a new skill with tests still
      # needs a step added here. Check that when adding one.
      - name: House-view attribution gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-house-view-attribution/ -q
      # Same reasoning as the attribution step above, extended to the other
      # roots run-gate-tests.sh already discovers locally but this hand-listed
      # file did not: each of the six named steps below is its own pytest
      # process for the same conftest-collision reason. house-view/tests and
      # white-label/tests both nest under skills/_parallax/ alongside the
      # scripts/ and test_render_gate.py roots above, but each is named
      # explicitly so a missing root stays visible in the step list.
      - name: House-view core gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/_parallax/house-view/tests -q
      # -m "not npx" matches run-gate-tests.sh's offline default: one test in
      # this root shells out to `npx -y`, which can download and execute a
      # package. That is opt-in network behavior, not something CI should run.
      - name: White-label extraction and validation gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/_parallax/white-label/tests -q -m "not npx"
      - name: Make-house-view gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-make-house-view/tests -q
      - name: Judge-house-view gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-judge-house-view/tests -q
      - name: Desk-call-list gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-desk-call-list/tests -q
      - name: White-label stock-report gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-white-label-stock-report/tests -q
      - name: Credit-lens gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/parallax-credit-lens/ -q
      # The translate suites keep their tests beside the validator they
      # exercise, under references/ rather than tests/. run-gate-tests.sh
      # discovers them by test-file glob, so the root is named here rather
      # than a tests/ subdirectory that does not exist.
      - name: Chinese translation validator gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/translate-chinese-finance/ -q
      - name: Thai translation validator gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest skills/translate-thai-finance/ -q
      # The local-only extra term file cannot exist on a runner, and
      # load_canary_terms() fails closed without it. PARALLAX_ALLOW_PARTIAL_SCAN
      # is the sanctioned opt-in: CI scans the built-in branding / code-name
      # terms only, so this step is a floor, not the full gate. The
      # full-strength scan runs pre-push on a machine that has the file.
      # scan_commit_messages.py is deliberately NOT wired in here — the shallow
      # checkout has no usable origin/main..HEAD range. It runs pre-push
      # instead, as a blocking hook layer installed by install_git_hooks.sh;
      # CLAUDE.md owns that contract. A clone without the hook falls back to
      # running the scanner by hand before pushing.
      - name: Tracked-term scan (built-in terms only)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          PARALLAX_ALLOW_PARTIAL_SCAN: "1"
        run: python skills/_parallax/scripts/scan_tracked_terms.py
      - name: Section cross-reference lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python skills/_parallax/scripts/section-ref-lint.py skills/
      - name: Coverage lint (informational)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash skills/_parallax/scripts/coverage-lint.sh || true
