version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/skills/_parallax/house-view"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "house-view"
    # Pinned exact versions are intentional for long-horizon replay determinism.
    # Dependabot raises PRs. Before merging a bump to rfc8785 or pynacl,
    # regenerate the signed test fixtures and re-run the house-view tests on
    # the new version.
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
