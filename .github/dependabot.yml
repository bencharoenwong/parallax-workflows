version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/skills/_parallax/house-view"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "house-view"
    # Pinned exact versions are intentional for long-horizon replay determinism.
    # Dependabot raises PRs. Before merging a bump to rfc8785 or pynacl,
    # follow the bump procedure in skills/_parallax/house-view/requirements.txt
    # (regenerate fixtures, test against both versions, document the cutover).
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
