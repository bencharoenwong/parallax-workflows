# `basis: total` on the region dimension. Weights are fractions of the TOTAL
# portfolio, so S0 divides them by mandate.strategic_allocation.equity (0.60):
#
#   us 0.33 / 0.60 = 0.55      europe 0.15 / 0.60 = 0.25
#   japan 0.06 / 0.60 = 0.10   em_ex_china 0.06 / 0.60 = 0.10
#
# which reproduces policy_full.yaml's sleeve weights exactly. Band edges convert
# with the same divisor: us {0.27, 0.39} / 0.60 = {0.45, 0.65}.
# Weights sum to 0.60 == equity, which is the sum rule on `total` basis.

metadata:
  schema_version: 1
  policy_id: "6d0a4b91-8c33-4e57-9f21-0b8e4c6a7d12"
  policy_name: "Balanced Growth (total basis)"
