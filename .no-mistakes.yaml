# Per-repo no-mistakes overrides for parallax-workflows.

# Gate agent for this repo.
agent: claude

# This repo is public, so a gate diff is already published. The maintainer's
# pre-push perimeter hook reads this literal only from the committed file.
# Do not copy this setting to a private repo.
perimeter: public-authorized

# Keep the generated Intent section out of public PR descriptions.
pr:
  publish_intent: false

# Deterministic test command: runs the full skill/eval suite, one pytest process
# per top-level test root so the tests/conftest.py files do not collide.
# See the script header for details.
commands:
  test: bash skills/_parallax/scripts/run-gate-tests.sh
